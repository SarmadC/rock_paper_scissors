<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>

<body>

    <button class="rock" type="button" > Rock</button>
    <button class="scissors" type="button"> Scissors </button>
    <button class="paper" type="button" > Paper </button>

    <div id="log-message">Display Results</div>

    <script>

        const buttons = document.querySelectorAll("button");

        buttons.forEach(button => {
            button.addEventListener("click", () => {
                const playerSelection = button.className;
                playRound(playerSelection);
            });
        });

        let humanScore = 0;
        let computerScore = 0;

        function getComputerChoice() {
            let computerMove = Math.random();
            if (computerMove < 0.34) {
                computerMove = 'rock';
                console.log(computerMove)
            }
            else if (computerMove >= 0.34 && computerMove < 0.66) {
                computerMove = 'paper';
                console.log(computerMove)
            }
            else {
                computerMove = 'scissors';
                console.log(computerMove)
            }
            return computerMove;
        }

        function playRound(playerSelection) {
            const human_move = playerSelection;
            const computerMove = getComputerChoice();
            if (human_move === 'scissors' && computerMove === 'paper') {
                const displayDiv = document.getElementById('log-message')
                displayDiv.textContent = `You've played ${human_move}
                Scissor beats Paper! You win`;
                humanScore += 1;
            }
            else if (human_move === 'scissors' && computerMove === 'rock') {
                displayDiv.textContent = `You've played ${human_move}
                Rock beats Paper! You lose!`
                computerScore += 1;
            }
            else if (human_move === 'paper' && computerMove === 'rock') {
                displayDiv.textContent = `You've played ${human_move}
                Paper beats rock! You win`;
                humanScore += 1;
            }
            else if (human_move === 'paper' && computerMove === 'scissors') {
                displayDiv.textContent = `You've played ${human_move}
                Scissor beats Paper! You lose!`;
                computerScore += 1;
            }
            else if (human_move === 'rock' && computerMove === 'scissors') {
                displayDiv.textContent = `You've played ${human_move}
                Rock beats scissors! You win`;
                humanScore += 1;
            }
            else if (human_move === 'rock' && computerMove === 'paper') {
                displayDiv.textContent = `You've played ${human_move}
                Paper beats rock! You lose!`;
                computerScore += 1;
            }
            else {
                console.log(human_move)
                console.log("Tie")
            }
        }

        function playGame(n) {
            for (let i = 0; i < n; i++) {
                playRound();
                console.log('Human Score: ' + humanScore + ' Computer Score: ' + computerScore)
            }
        }

    </script>
</body>

</html>
