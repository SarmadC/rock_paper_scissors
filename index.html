<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>

<body>

    <button class="rock" type="button"> Rock</button>
    <button class="scissors" type="button"> Scissors </button>
    <button class="paper" type="button"> Paper </button>

    <div id="log-message">Display Results</div>

    <script>

        const buttons = document.querySelectorAll("button");
        const displayDiv = document.getElementById('log-message');

        buttons.forEach(button => {
            button.addEventListener("click", () => {
                const playerSelection = button.className;
                playRound(playerSelection);
            });
        });

        let humanScore = 0;
        let computerScore = 0;

        function getComputerChoice() {
            let computerMove = Math.random();
            if (computerMove < 0.34) {
                computerMove = 'rock';
                displayDiv.textContent = (computerMove)
            }
            else if (computerMove >= 0.34 && computerMove < 0.66) {
                computerMove = 'paper';
                displayDiv.textContent = (computerMove);
            }
            else {
                computerMove = 'scissors';
                displayDiv.textContent = (computerMove)
            }
            return computerMove;
        }

        function playRound(playerSelection) {
            const human_move = playerSelection;
            const computerMove = getComputerChoice();

            if (human_move === 'scissors' && computerMove === 'paper') {
                humanScore += 1;
                computerScore += 0;
                displayDiv.textContent = `You've played ${human_move} \n
                Scissor beats Paper! You win \n Current score: User - ${humanScore} vs. Computer - ${computerScore} `;
                declareWinner();
            }

            else if (human_move === 'scissors' && computerMove === 'rock') {
                computerScore += 1;
                humanScore += 0;
                displayDiv.textContent = `You've played ${human_move} \n
                Rock beats Paper! You lose! \n Current score: User - ${humanScore} vs. Computer - ${computerScore} `;
                declareWinner();

            }
            else if (human_move === 'paper' && computerMove === 'rock') {
                humanScore += 1;
                computerScore += 0;
                displayDiv.textContent = `You've played ${human_move} \n
                Paper beats rock! You win \n Current score: User - ${humanScore} vs. Computer - ${computerScore} `;
                declareWinner();
            }
            else if (human_move === 'paper' && computerMove === 'scissors') {
                computerScore += 1;
                humanScore += 0;
                displayDiv.textContent = `You've played ${human_move} \n
                Scissor beats Paper! You lose! \n Current score: User - ${humanScore} vs. Computer - ${computerScore} `;
                declareWinner();
            }
            else if (human_move === 'rock' && computerMove === 'scissors') {
                humanScore += 1;
                computerScore += 0;
                displayDiv.textContent = `You've played ${human_move} \n
                Rock beats scissors! You win \n Current score: User - ${humanScore} vs. Computer - ${computerScore} `;
                declareWinner();
            }
            else if (human_move === 'rock' && computerMove === 'paper') {
                computerScore += 1;
                humanScore += 0;
                displayDiv.textContent = `You've played ${human_move} \n
                Paper beats rock! You lose!  \n Current score: User - ${humanScore} vs. Computer - ${computerScore}`;
                declareWinner();
            }
            else {
                displayDiv.textContent = `Tie`;
                declareWinner();
            }
        }

        function declareWinner(){
            if (computerScore == 5){
                displayDiv.textContent = "Computer wins!";
                buttons.forEach(button => button.disabled = true);
            }
            else if(humanScore == 5) {
                displayDiv.textContent = "Human wins";
                buttons.forEach(button => bbutton.disabled = true);
            }
        }
    </script>
</body>

</html>
